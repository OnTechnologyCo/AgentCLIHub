    wv?.postMessage({ t: 'conf.language', language: value });
    $('ui-language')?.focus();
  });
  languageGrid.append(languageLabel, languageSelect);
  note(languageGrid, tr('언어는 즉시 적용하고 자동으로 저장합니다.'));

  const startupGrid = card(tr('시작프로그램'));
  const startupLabel = document.createElement('label');
  startupLabel.htmlFor = 'run-at-startup';
  startupLabel.textContent = tr('Windows 시작 시 자동 실행');
  const startupSelect = document.createElement('select');
  startupSelect.id = 'run-at-startup';
  for (const [value, label] of [['false', tr('꺼짐')], ['true', tr('켜짐')]]) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    startupSelect.appendChild(option);
  }
  startupSelect.value = v.RunAtStartup === true ? 'true' : 'false';
  startupSelect.addEventListener('change', () => {
    const on = startupSelect.value === 'true';
    v.RunAtStartup = on;
    wv?.postMessage({ t: 'conf.startup', on });
  });
  startupGrid.append(startupLabel, startupSelect);
  note(startupGrid, tr('바꾸는 즉시 현재 Windows 계정 시작프로그램에 반영됩니다. 로그인 시 창을 열고 이전 탭을 복원합니다.'));

  PetUI.render(card(tr('펫')).parentElement);

  // **여기서 CLI 를 고르지 않는다.** 어느 CLI 로 열지는 [＋ 새 대화] 를 누를 때마다 고른다.
  // 여기 있는 것은 CLI 마다 "그 CLI 를 고르면 무엇을 걸고 뜰까" 다.
  const g0 = card(tr('새 대화'));
  note(g0, tr('어느 CLI 로 열지는 [＋ 새 대화] 를 누를 때마다 고릅니다.\n') +
           tr('아래 CLI 별 값은 그 CLI 를 고른 대화에 걸립니다 — 이미 열려 있는 탭은 각자 시작할 때의 값으로 계속 돕니다.'));
  g0.remove();              // 칸이 없는 카드다. 빈 격자가 남으면 제목과 글 사이만 벌어진다

  // ── 계정 ───────────────────────────────────────────
  // CLI 마다 계정을 여러 개 둔다. 한 계정의 한도가 차면 탭 오른쪽 버튼 [다른 계정으로 이어가기] 로 넘긴다.
  // **여기 단추는 누르는 즉시 일어난다**(아래 [저장] 과 무관하다) — 로그인은 탭을 열어 하는 일이라
  // 저장 단추에 묶어 둘 수가 없다.
  const g7 = card(tr('계정'));
  g7.className = 'accs';
  const accs = CONF.accounts || [];
  Object.keys(CONF.catalog).forEach(b => {
    const k = cat(b);
    const found = CONF.detect?.[b]?.found !== false;
    const head = document.createElement('div');
    head.className = 'acch';
    head.textContent = k.display || b;
    g7.appendChild(head);

    if (k.supportsAccounts === false) {
      const info = document.createElement('div');
      info.className = 'note';
      info.style.gridColumn = '1 / -1';
      info.textContent = tr('CLI 에 로그인한 계정을 사용합니다. [＋ 새 대화] 에서 Antigravity 를 열어 로그인하세요.');
      g7.appendChild(info);
      return;
    }

    accs.filter(a => a.backend === b).forEach(a => accountRow(g7, a));

    const add = document.createElement('div');
    add.className = 'accadd';
    const nm = document.createElement('input');
    nm.dataset.confDraft = 'new-account:' + b;
    nm.placeholder = tr('새 계정 이름 (예: 회사 · 개인)');
    nm.maxLength = 20;
    // claude 는 로그인 방식을 고른다 — claude auth login 의 세 갈래 그대로다.
    let method = null;
    if (b === 'claude_code') {
      method = document.createElement('select');
      method.dataset.confDraft = 'login-method:' + b;
      [['', tr('claude.ai 계정 (Pro · Max · Team · Enterprise)')],
       ['sso', tr('회사 SSO 로 로그인')],
       ['console', tr('Console (API 과금)')]].forEach(([v, t]) => {
        const o = document.createElement('option');
        o.value = v; o.textContent = t;
        method.appendChild(o);
      });
      method.title = tr('회사 계정: Team · Enterprise 는 claude.ai 계정(회사 이메일) 또는 회사 SSO, API 과금 계정은 Console');
    }
    const btn = document.createElement('button');
    btn.className = 'btn act';
    btn.textContent = tr`＋ ${k.display || b} 계정 추가`;
    btn.disabled = !found;
    btn.title = found ? tr('계정을 더하고 곧바로 로그인 탭을 엽니다') : tr('이 CLI 를 찾지 못해 계정을 더할 수 없습니다');
    btn.addEventListener('click', () => {
      wv?.postMessage({ t: 'account.add', backend: b, name: nm.value.trim(), login: method ? method.value : '' });
      nm.value = '';
    });
    nm.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); btn.click(); } });
    add.append(...[nm, method, btn].filter(Boolean));
    g7.appendChild(add);
  });
  note(g7,
    tr('한 계정의 사용 한도가 차면, 탭을 오른쪽 버튼으로 누르고 [다른 계정으로 이어가기] 에서 한도가 남은 계정을 고르세요. ') +
    tr('같은 탭에서 대화가 이어집니다 — Claude Code · Codex · Antigravity 사이도 됩니다.\n') +
    tr('• Claude Code 계정: [＋ 추가] 를 누르면 그 계정 폴더로 `claude auth login` 이 열립니다 — 평소 하던 로그인 그대로입니다. ') +
    tr('회사 계정은 Team·Enterprise 면 claude.ai 계정(회사 이메일)이나 회사 SSO, API 과금 계정이면 Console 을 고르세요. ') +
    tr('로그인은 그 계정 폴더에만 남고 기본 계정의 로그인은 그대로입니다. 대화 기록·플러그인·스킬·설정은 기본 계정과 같이 쓰고, ') +
    tr('사용량도 읽힙니다. 승인 뒤 코드가 보이면 로그인 탭의 "Paste code here" 에 붙여 넣으세요. ') +
    tr('[토큰] 은 대안(setup-token 1년 토큰 · 추론 전용)입니다.\n') +
    tr('• Codex 계정: [＋ 추가] 를 누르면 그 계정 폴더로 `codex login` 이 열립니다. 계정마다 폴더(CODEX_HOME)가 따로고, ') +
    tr('기본 계정의 config.toml · AGENTS.md · skills · plugins · 샌드박스 설정을 따라갑니다.\n') +
    tr('• Antigravity 계정: [＋ 추가] 후 터미널의 Google 로그인 안내를 따르세요. 로그인 완료 후 /exit로 종료하세요. 로그인·설정·대화 기록은 계정마다 따로 저장됩니다.\n') +
    tr('• 기본 계정도 [이름]으로 표시명을 바꿀 수 있습니다.\n') +
    tr('• 로그인 페이지가 열린 브라우저가 이미 다른 계정으로 로그인돼 있으면 그 계정이 승인됩니다 — 먼저 로그아웃하거나 계정을 바꾸세요.\n') +
    tr('• 같은 CLI 계정끼리는 같은 대화를 그대로 잇고(Claude), 그 밖에는 앞 대화를 받을 CLI 의 기록으로 옮겨 써서 이어갑니다. 원본은 그대로 남습니다.'));

  // ── CLI 별: 모델 · 추론 강도 · 권한 ────────────────
  // **CLI 마다 한 장씩, 둘 다 보인다.** 새 대화마다 CLI 를 고르므로 어느 쪽이든 쓰인다 —
  // 한 장만 보이게 두면 안 보이는 쪽에 무엇이 걸려 있는지 고르기 전에는 알 수 없다.
  // 칸 이름(ClaudeModel …)은 호스트의 표가 준다(modelKey · effortKey · perm[].key).
  Object.keys(CONF.catalog).forEach(b => {
    const k = cat(b);
    const g = card(k.display || b);
    if (b === 'antigravity_cli' && k.modelKey) {
      const label = document.createElement('label');
      label.textContent = tr('모델'); label.htmlFor = 'ag-model';
      const wrap = document.createElement('div');
      const select = document.createElement('select');
      select.id = 'ag-model'; select.style.width = '100%';
      select.setAttribute('aria-label', tr('Antigravity 모델'));
      const custom = document.createElement('input');
      custom.id = 'ag-model-custom'; custom.style.width = '100%'; custom.style.marginTop = '6px';
      custom.setAttribute('aria-label', tr('Antigravity 모델 직접 입력'));
      custom.placeholder = tr('모델 ID 또는 이름');
      select.addEventListener('change', () => {
        const manual = select.value === '__custom_model__';
        select.dataset.manual = manual ? '1' : '';
        custom.hidden = !manual;
        if (manual) { custom.value = v[k.modelKey] || ''; custom.focus(); }
        else { v[k.modelKey] = select.value; custom.value = select.value; }
      });
      custom.addEventListener('input', () => { v[k.modelKey] = custom.value; });
      wrap.append(select, custom); g.append(label, wrap);
      const statusRow = document.createElement('div'); statusRow.className = 'note';
      const status = document.createElement('span'); status.id = 'ag-model-status';
      const refresh = document.createElement('button');
      refresh.id = 'ag-model-refresh'; refresh.className = 'btn'; refresh.textContent = tr('다시 불러오기');
      refresh.style.marginLeft = '8px';
      refresh.addEventListener('click', () => wv?.postMessage({ t: 'conf.models.refresh', path: v.AntigravityCliPath || '' }));
      statusRow.append(status, refresh); g.parentElement.appendChild(statusRow);
      updateAntigravityModelOptions();
    } else if (k.modelKey && k.modelsComplete) {
      // codex 는 목록을 자기가 준다(models_cache.json). 없는 슬러그는 거절되므로 고르게만 한다.
      field(g, tr('모델'), k.modelKey, { choices: [''].concat(k.models || []), rerender: true });
    } else if (k.modelKey) {
      // claude 는 별칭이 편의일 뿐이다. 전체 모델 이름도 받으므로 **직접 칠 수 있어야 한다.**
      field(g, tr('모델'), k.modelKey, { list: k.models || [], hint: tr('비우면 CLI 기본 모델') });
    }
    if (k.effortKey) field(g, tr('추론 강도'), k.effortKey, { choices: effortChoices(b, v[k.modelKey]) });
    (k.perm || []).forEach(f => field(g, tr(f.label), f.key, { choices: [''].concat(f.choices) }));

    if (b === 'antigravity_cli') {
      note(g, tr('모델·추론 강도를 비우면 Antigravity 에서 선택한 값을 사용합니다. CLI 의 /model, /settings 에서도 선택할 수 있습니다.\n') +
        tr('권한을 비우면 CLI 설정을 따릅니다. sandbox 는 샌드박스 사용, dangerously-skip-permissions 는 도구 승인 생략입니다.\n') +
        tr('지난 대화는 [↻ 이어하기] 또는 CLI 의 /resume, 사용량은 /usage 에서 확인합니다.'));
      return;
    }

    const codex = b === 'codex_cli';
    note(g, [
      tr`작업 폴더의 ${k.memoryFile} 를 자동으로 읽습니다.`,
      codex
        ? (k.modelsComplete
            ? tr('모델마다 받는 추론 강도가 다릅니다 — 모델을 바꾸면 추론 강도 목록이 따라 바뀝니다.\n') +
              tr('모델 목록은 codex 가 캐시해 둔 것(models_cache.json)을 그대로 읽습니다.')
            : tr('codex 의 모델 목록(models_cache.json)을 읽지 못했습니다 — 모델 이름을 직접 치세요.'))
        : tr('별칭(opus · sonnet …) 말고 전체 모델 이름도 받습니다 — 목록에 없어도 칠 수 있습니다.'),
      codex
        ? tr('샌드박스(-s)와 승인(-a)은 별개 축입니다. 하나로 합쳐 두면 화면에 적힌 이름과 실제로 걸리는 플래그가 갈라집니다.')
        : tr('권한은 --permission-mode 하나가 승인과 접근을 함께 정합니다.'),
    ].join('\n'));
  });

  // ── 실행 파일 ──────────────────────────────────────
  const g4 = card(tr('실행 파일'));
  Object.keys(CONF.catalog).forEach(b => {
    const key = cat(b).pathKey || ({ claude_code: 'ClaudeCliPath', codex_cli: 'CodexCliPath', antigravity_cli: 'AntigravityCliPath' })[b];
    const d = CONF.detect?.[b] || {};
    const inp = field(g4, cat(b).display || b, key, { hint: tr('비우면 자동 탐지') });

    const wrap = document.createElement('div');
    wrap.className = 'row2';
    inp.replaceWith(wrap);
    wrap.appendChild(inp);
    const pick = document.createElement('button');
    pick.className = 'btn';
    pick.textContent = tr('찾아보기');
    pick.addEventListener('click', () => wv?.postMessage({ t: 'cli.pick', which: b }));
    wrap.appendChild(pick);

    // **지금 무엇이 잡혔는지 보여 준다.** 빈 칸만 보이면 지정을 해야 하는지 아닌지
    // 알 수가 없고, 안 뜰 때 어디를 봐야 할지도 모른다.
    const l2 = document.createElement('label');
    l2.textContent = '';
    const det = document.createElement('div');
    det.className = 'det' + (d.found ? '' : ' bad');
    det.textContent = d.found
      ? `✔ ${d.path}   (${d.source}${d.bypass ? tr(' · node 직접 호출') : ''})`
      : `✘ ${tr(d.error) || tr('찾지 못했습니다')}`;
    g4.append(l2, det);
  });
  note(g4, tr('경로를 비워 두면 자동으로 찾습니다. Codex 는 PowerShell 명령과 현재 설치 버전을 확인합니다.\n설정 파일: ') + CONF.file +
           (CONF.version ? '\nAgentCLIHub ' + CONF.version : ''));

  // ── 브라우저 바로가기(북마크) ──────────────────────
  // 고정 세 칸(Jira · GitHub · GitLab)이 아니라 **목록이다.** 사내에는 Jira 가 여럿이고
  // GitLab 이 프로젝트마다 다른 일이 흔한데, 고정 칸은 그때 "하나만 골라라" 가 된다.
  const g5 = card(tr('브라우저 바로가기'));
  g5.className = 'bm';                       // 이 카드만 격자가 넷이다(이름 · 주소 · 표시 · 손잡이)
  const marks = (v.Bookmarks ||= []);

  // 목록을 건드리면(추가·삭제·순서) 카드를 다시 그린다. **스크롤 자리를 붙잡아 둔다** —
  // 안 그러면 아래쪽 줄을 지울 때마다 화면이 맨 위로 튀어 어디를 지웠는지 놓친다.
  const redraw = () => { const y = box.scrollTop; renderConf(); box.scrollTop = y; renderSites(); };

  if (marks.length) {
    [tr('이름'), tr('주소'), '', ''].forEach(t => {
      const h = document.createElement('div');
      h.className = 'bmh';
      h.textContent = t;
      g5.appendChild(h);
    });
  }

  marks.forEach((bm, i) => {
    // 글자 칸은 다시 그리지 않는다 — 한 글자마다 카드를 새로 만들면 커서가 튄다.
    // 값만 고치고 머리줄에 바로 비춘다(저장까지 기다리면 맞게 쳤는지 확인이 안 된다).
    const nameIn = document.createElement('input');
    nameIn.value = bm.Name ?? '';
    nameIn.placeholder = tr('버튼에 찍힐 이름');
    nameIn.maxLength = 40;
    nameIn.addEventListener('input', () => { bm.Name = nameIn.value; renderSites(); });

    const urlIn = document.createElement('input');
    urlIn.value = bm.Url ?? '';
    urlIn.placeholder = tr('예: https://회사이름.atlassian.net');
    urlIn.addEventListener('input', () => { bm.Url = urlIn.value; renderSites(); });

    // 켜고 끄기는 체크상자가 아니라 목록이다 — 무엇이 켜진 것인지 라벨을 되짚지 않아도 된다.
    const show = document.createElement('select');
    [['true', tr('표시')], ['false', tr('숨김')]].forEach(([val, txt]) => {
      const o = document.createElement('option');
      o.value = val; o.textContent = txt;
      show.appendChild(o);
    });
    show.value = bm.Show === false ? 'false' : 'true';
    show.addEventListener('change', () => { bm.Show = show.value === 'true'; renderSites(); });

    const ops = document.createElement('div');
    ops.className = 'bmops';
    const op = (txt, title, on, off) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = txt;
      b.title = title;
      b.disabled = !!off;
      if (!off) b.addEventListener('click', on);
      ops.appendChild(b);
    };
    // 순서가 곧 머리줄 순서다. 자주 쓰는 것을 앞으로 당길 길이 없으면 목록은 금방 못 쓰게 된다.
    op('↑', tr('한 칸 앞으로'), () => { marks.splice(i - 1, 0, marks.splice(i, 1)[0]); redraw(); }, i === 0);
    op('↓', tr('한 칸 뒤로'), () => { marks.splice(i + 1, 0, marks.splice(i, 1)[0]); redraw(); }, i === marks.length - 1);
    op('×', tr('이 바로가기를 지웁니다'), () => { marks.splice(i, 1); redraw(); });

    g5.append(nameIn, urlIn, show, ops);
  });

  if (!marks.length) {
    // 빈 목록을 빈 칸으로 두지 않는다 — 설정이 고장 난 것처럼 보인다.
    const e = document.createElement('div');
    e.className = 'bmempty';
    e.textContent = tr('바로가기가 없습니다. 아래에서 추가하세요.');
    g5.appendChild(e);
  }

  // 추가 줄. 자주 쓰는 셋은 주소까지 채워 넣는다 — 매번 도메인을 외워 치게 두지 않는다.
  //
  // **개수를 여기서도 막는다.** 호스트도 MAX 에서 자르는데(MainWindow.ReadBookmarks),
  // 화면이 안 막으면 넘치게 넣고 저장한 뒤에야 조용히 사라진 것을 보게 된다.
  const MAX_MARKS = 30;
  const full = marks.length >= MAX_MARKS;
  const add = document.createElement('div');
  add.className = 'bmadd';
  const push = (nm, url) => { marks.push({ Name: nm, Url: url, Show: true }); redraw(); };
  const addBtn = (cls, txt, title, fn) => {
    const b = document.createElement('button');
    b.className = cls;
    b.textContent = txt;
    b.title = full ? tr`바로가기는 ${MAX_MARKS} 개까지입니다` : title;
    b.disabled = full;
    if (!full) b.addEventListener('click', fn);
    add.appendChild(b);
  };
  addBtn('btn act', tr('＋ 추가'), tr('빈 줄을 하나 만듭니다'), () => {
    push('', '');
    // 새로 생긴 줄의 이름 칸으로 커서를 보낸다 — 어디에 쳐야 하는지 찾게 두지 않는다.
    box.querySelectorAll('.bm > input')[(marks.length - 1) * 2]?.focus();
  });
  addBtn('btn', 'Jira', tr('주소는 사내 것으로 고치세요'), () => push('Jira', tr('https://회사이름.atlassian.net')));
  addBtn('btn', 'GitHub', tr('github.com 줄을 만듭니다'), () => push('GitHub', 'https://github.com'));
  addBtn('btn', 'GitLab', tr('gitlab.com 줄을 만듭니다'), () => push('GitLab', 'https://gitlab.com'));
  if (full) {
    const cap = document.createElement('span');
    cap.className = 'note';
    cap.style.marginTop = '0';
    cap.textContent = tr`바로가기는 ${MAX_MARKS} 개까지입니다 — 머리줄은 탭띠와 자리를 나눠 씁니다.`;
    add.appendChild(cap);
  }
  g5.parentElement.appendChild(add);

  note(g5, tr('웹 브라우저 북마크와 같습니다 — 원하는 만큼 넣고 지우세요. **적은 순서 그대로** 머리줄에 붙습니다.\n') +
           tr('[숨김] 으로 두면 주소는 그대로 두고 버튼만 사라집니다 — 안 쓰는 동안 주소까지 지우면 다시 켤 때 찾아서 또 쳐야 합니다.\n') +
           tr('주소가 비어 있으면 [표시] 라도 버튼은 안 나옵니다 — 눌러도 갈 곳이 없는 버튼은 고장으로 보입니다.\n') +
           tr('스킴(https://)은 안 쳐도 됩니다. 이름을 비우면 주소의 호스트가 이름이 됩니다.\n') +
           tr('로그인은 브라우저 프로필에 남아 앱을 껐다 켜도 유지됩니다. 탭 안에서 Ctrl+F 찾기, Ctrl+휠 확대가 됩니다.'));

  // ── 브라우저 로그인 ────────────────────────────────
  // **왜 따로 있나.** WebView2 는 만료 시각이 있는 쿠키만 프로필에 남기고 세션 쿠키는
  // 프로세스가 죽을 때 버린다 — 그래서 어떤 사이트는 그냥 유지되는데 어떤 사이트만
  // 껐다 켤 때마다 로그아웃된다. 여기 켜 두면 그 세션 쿠키를 꺼내 뒀다 되돌린다.
  const g6 = card(tr('로그인'));
  field(g6, tr('Claude 로그인 지키기'), 'GuardClaudeLogin', { bool: true, on: tr('지킴'), off: tr('안 지킴') });
  field(g6, tr('브라우저 로그인 유지'), 'KeepSignedIn', { bool: true, on: tr('유지함'), off: tr('유지 안 함') });
  field(g6, tr('비밀번호 저장'), 'SavePasswords', { bool: true, on: tr('저장함'), off: tr('저장 안 함') });

  const clr = document.createElement('div');
  clr.className = 'row2';
  clr.style.gridColumn = '2';
  const wipe = (txt, title, all) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = txt;
    b.title = title;
    // **한 번 묻는다.** 되돌릴 수 없는 것을 한 번의 실수로 날리게 두지 않는다.
    b.addEventListener('click', () => {
      if (b.dataset.armed !== '1') {
        b.dataset.armed = '1';
        b.textContent = tr('정말 지울까요? (다시 누르기)');
        b.classList.add('on');
        setTimeout(() => {
          if (b.dataset.armed !== '1') return;
          b.dataset.armed = '';
          b.textContent = txt;
          b.classList.remove('on');
        }, 4000);
        return;
      }
      b.dataset.armed = '';
      b.textContent = txt;
      b.classList.remove('on');
      wv?.postMessage({ t: 'signin.clear', all });
    });
    clr.appendChild(b);
  };
  wipe(tr('저장된 비밀번호 지우기'), tr('자동 저장된 비밀번호만 지웁니다'), false);
  wipe(tr('로그인 전부 지우기'), tr('쿠키·사이트 저장소까지 지웁니다 — 모든 사이트에서 로그아웃됩니다'), true);
  g6.append(document.createElement('label'), clr);

  note(g6,
    tr('[Claude 로그인 지키기] 는 ~/.claude.json 과 토큰이 성할 때 사본을 떠 두었다가, 켤 때 그것이 \n') +
    tr('깨져 있으면 되돌립니다 — 탭마다 claude 를 하나씩 띄우는 앱이라 여러 프로세스가 같은 파일을 쓰다 \n') +
    tr('잘리는 일이 실제로 있었고, 그때 화면에는 "로그인이 풀렸다" 로만 보입니다. \n') +
    tr('사본은 이 Windows 계정에 묶여 암호화됩니다(DPAPI). \n\n') +
    tr('[브라우저 로그인 유지] 는 세션 쿠키를 꺼내 뒀다가 다음에 켤 때 되돌립니다 — 이것이 없으면 \n') +
    tr('세션 쿠키를 쓰는 사이트만(사내 SSO 등) 껐다 켤 때마다 로그아웃됩니다. 만료 시각이 있는 쿠키를 \n') +
    tr('쓰는 곳(Jira 등)은 원래도 유지되므로 차이가 안 느껴집니다. \n') +
    tr('**공용 PC 면 [유지 안 함] 으로 두세요** — 끄면 그 파일 자체가 안 생기고, 남아 있던 것도 지웁니다. \n') +
    tr('[비밀번호 저장] 을 꺼도 이미 저장된 것은 안 지워집니다 — 지우려면 위 단추를 쓰세요.'));

  // ── 텔레그램 원격 ──────────────────────────────────
  // **여기 단추도 누르는 즉시 일어난다**(아래 [저장] 과 무관하다) — 토큰 확인·페어링은 그 자리에서 끝나는 일이다.
  const g8 = card(tr('텔레그램 원격'));
  g8.id = 'tg-grid';
  renderTelegram();
  note(g8,
    tr('텔레그램 봇으로 이 앱의 CLI 탭에 질문하고 답을 받습니다. 앱이 떠 있는 동안만 동작합니다.\n') +
    tr('1) 텔레그램에서 @BotFather 에게 /newbot 을 보내 봇을 만들고, 받은 토큰을 위에 넣어 저장합니다.\n') +
    tr('2) [사용] 을 켜고 [페어링 코드 만들기] 를 누른 뒤, 봇에게 /pair 코드 를 보냅니다.\n') +
    tr('3) 봇에게 글을 보내면 고른 탭의 CLI 로 들어가고, 끝나면 답이 옵니다. /help 로 명령을 봅니다.\n\n') +
    tr('**페어링한 대화는 이 PC 의 CLI 를 부릴 수 있습니다** — 승인 창은 텔레그램 단추로 오지만, 승인 없이 도는 권한 설정이면 \n') +
    tr('파일 수정·명령 실행까지 원격에서 바로 일어납니다. 쓰지 않는 대화는 [×] 로 지우세요. \n') +
    tr('토큰은 이 Windows 계정에 묶여 암호화됩니다(DPAPI). 이 PC 로 들어오는 포트는 열지 않습니다 — 텔레그램 서버에서 받아 옵니다.'));

  // ── 예약 작업 ──────────────────────────────────────
  // **여기 단추도 누르는 즉시 일어난다**(아래 [저장] 과 무관하다) — 일정은 저장하는 순간부터 센다.
  const g9 = card(tr('예약 작업'));
  g9.id = 'sched-grid';
  g9.className = 'schedbox';
  renderSchedules();
  note(g9,
    tr('정해 둔 시각에 CLI 탭으로 프롬프트를 보내고, 끝나면 결과를 아래 실행 기록에 남깁니다. 최소 1분 간격까지 정할 수 있습니다.\n') +
    tr('앱이 켜져 있는 동안만 동작합니다 — 꺼져 있던 동안 지나간 회차는 켤 때 몰아서 실행하지 않습니다.\n') +
    tr('이전 실행이 끝나지 않았는데 다음 시각이 오면, 끝난 뒤 한 번만 이어서 실행합니다.\n') +
    tr('[새 탭 열기] 는 실행할 때마다 탭을 새로 열며, 모델·추론 강도를 작업마다 따로 고를 수 있습니다(비우면 설정 기본값). 간격이 짧으면 [끝나면 탭 닫기] 를 고르세요. 보던 화면은 바뀌지 않습니다.\n') +
    tr('승인 창이 뜨면 기록(과 켜 두면 텔레그램)으로 알리고 기다립니다. **승인 없이 도는 권한 설정이면 예약한 프롬프트가 파일 수정·명령 실행까지 자동으로 진행합니다.**'));

  // ── 저장 ───────────────────────────────────────────
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:8px;align-items:center;max-width:860px';
  const save = document.createElement('button');
  save.id = 'conf-save';
  save.className = 'btn act';
  save.textContent = tr('저장');
  save.addEventListener('click', () => wv?.postMessage({ t: 'conf.save', v: CONF.settings }));
  bar.appendChild(save);
  const m = document.createElement('span');
  m.className = 'note';
  m.style.marginTop = '0';
  m.textContent = tr('저장한 값은 다음에 여는 대화부터 적용됩니다.');
  bar.appendChild(m);
  box.appendChild(bar);
}

// 텔레그램 원격 칸. 상태가 바뀔 때마다(tg.state) **이 칸만** 다시 그린다 — 설정 전체를 다시 그리면
// 다른 칸에서 치던 글자와 스크롤 자리가 날아간다.
let tgTimer = 0;
function renderTelegram() {
  const g = document.getElementById('tg-grid');
  if (!g || !CONF) return;
  const s = CONF.telegram || {};
  g.replaceChildren();
  clearTimeout(tgTimer);

  const label = text => { const l = document.createElement('label'); l.textContent = text; return l; };
  const span = (text, color) => {
    const e = document.createElement('span');
    e.textContent = text; e.style.fontSize = '12px';
    if (color) e.style.color = color;
    return e;
  };
  const button = (text, title, fn, cls = 'btn') => {
    const b = document.createElement('button');
    b.className = cls; b.textContent = text;
    if (title) b.title = title;
    b.addEventListener('click', fn);
    return b;
  };
  const row = (text, ...els) => {
    const d = document.createElement('div');
    d.className = 'row2';
    d.style.cssText = 'align-items:center;flex-wrap:wrap';
    d.append(...els);
    g.append(label(text), d);
    return d;
  };

  let status, color = '#99a';
  if (!s.hasToken) status = tr('토큰 없음');
  else if (!s.enabled) status = tr('꺼짐');
  else if (s.error) { status = s.error; color = '#e88'; }
  else if (s.connected) { status = tr('연결됨') + (s.bot ? ' · @' + s.bot : ''); color = '#8FD8A8'; }
  else status = tr('연결하는 중…');
  row(tr('상태'), span(status, color));

  const on = document.createElement('select');
  [['true', tr('켜짐')], ['false', tr('꺼짐')]].forEach(([val, txt]) => {
    const o = document.createElement('option');
    o.value = val; o.textContent = txt;
    on.appendChild(o);
  });
  on.value = s.enabled ? 'true' : 'false';
  on.addEventListener('change', () => wv?.postMessage({ t: 'tg.enable', on: on.value === 'true' }));
  g.append(label(tr('사용')), on);

  const tok = document.createElement('input');
  tok.type = 'password'; tok.autocomplete = 'off'; tok.spellcheck = false;
  tok.placeholder = s.hasToken ? s.token + ' ' + tr('(저장됨 — 바꾸려면 새로 넣기)') : tr('BotFather 가 준 토큰 (123456:ABC…)');
  tok.style.cssText = 'flex:1;min-width:220px';
  const save = () => { const v = tok.value.trim(); tok.value = ''; if (v) wv?.postMessage({ t: 'tg.token', token: v }); };
  tok.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  const tokRow = row(tr('봇 토큰'), tok, button(tr('저장'), tr('토큰을 확인하고 암호화해 저장합니다'), save, 'btn act'));
  if (s.hasToken) tokRow.append(button(tr('지우기'), tr('저장된 토큰을 지웁니다'), () => wv?.postMessage({ t: 'tg.token.clear' })));
  if (s.note) row('', span(s.note, '#cde'));

  const pair = row(tr('페어링'));
  if (s.pairCode && s.pairUntil > Date.now()) {
    const left = Math.max(1, Math.ceil((s.pairUntil - Date.now()) / 60000));
    const code = span(s.pairCode, '#ffd27a');
    code.style.cssText += ';font-family:Consolas,monospace;font-size:15px;letter-spacing:1px;user-select:all';
    pair.append(code, span(tr`봇에게 /pair ${s.pairCode} 를 보내세요 — ${left}분 남음`));
    tgTimer = setTimeout(renderTelegram, 30000);   // 남은 시간을 고쳐 쓰고, 지나면 코드를 지운다
  }
  const mk = button(tr('페어링 코드 만들기'), tr('10분 동안 쓸 수 있는 한 번용 코드를 만듭니다'), () => wv?.postMessage({ t: 'tg.pair' }));
  mk.disabled = !s.running;
  pair.append(mk);

  const chats = s.chats || [];
  if (!chats.length) row(tr('허용된 대화'), span(tr('없음 — 페어링한 대화만 봇을 쓸 수 있습니다'), '#6b7684'));
  chats.forEach((c, i) => {
    const r = row(i === 0 ? tr('허용된 대화') : '', span((c.name || tr('(이름 없음)')) + ' · ' + c.id));
    r.append(button('×', tr('이 대화의 허용을 거둡니다'), () => wv?.postMessage({ t: 'tg.chat.remove', id: c.id })));
  });
}

// ── 예약 작업 칸 ─────────────────────────────────────
// 상태(sched.state)가 올 때마다 **목록과 기록만** 다시 그린다. 편집 칸은 손대지 않는다 — 1분마다 도는 작업이
// 끝날 때마다 편집 칸을 다시 그리면 치던 글자와 커서가 날아간다. 편집 값은 SCHED_EDIT 에 바로 적어 둔다.
let SCHED_EDIT = null;
let schedManualModel = false;
const SCHED_OPEN = new Set();
let schedPreviewSeq = 0, schedPreviewTimer = 0;
const SCHED_DAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

function schedFmt(ms) {
  if (!ms) return '';
  return new Date(ms).toLocaleString(UiLanguage.current === 'en' ? 'en-US' : 'ko-KR',
    { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
}

function schedWhen(j) {
  switch (j.Repeat) {
    case 'interval': return j.Unit === 'h' ? tr`${j.Every}시간마다` : tr`${j.Every}분마다`;
    case 'daily': return tr`매일 ${j.Time}`;
    case 'weekly': return tr`매주 ${(j.Days || []).map(d => tr(SCHED_DAYS[d])).join(', ')} ${j.Time}`;
    case 'once': return tr`한 번 · ${(j.At || '').replace('T', ' ')}`;
    case 'cron': return 'cron · ' + (j.Cron || '');
  }
  return '';
}

function schedAccountLabel(a) { return a.id === '' && (!a.name || a.name === '기본') ? tr('기본') : a.name; }

function schedWhere(j) {
  if (j.Target === 'tab') return tr`탭: ${j.TabName}`;
  const cli = CONF.catalog?.[j.Backend]?.display || cliName(j.Backend);
  const acc = j.Account ? (CONF.accounts || []).find(a => a.backend === j.Backend && a.id === j.Account) : null;
  const model = j.Model ? (CONF.catalog?.[j.Backend]?.modelLabels?.[j.Model] || j.Model) : '';
  return tr`새 탭: ${j.Folder} · ${cli}`
    + (acc ? ' · ' + schedAccountLabel(acc) : '')
    + (model ? ' · ' + model : '')
    + (j.Effort ? ' · ' + j.Effort : '')
    + (j.CloseTab ? tr(' · 끝나면 닫기') : '');
}

function schedNewDraft() {
  const at = new Date(Date.now() + 3600000);
  const pad = n => String(n).padStart(2, '0');
  const backends = Object.keys(CONF?.catalog || {});
  return { Id: '', Name: '', Enabled: true, Prompt: '', Target: 'new', TabName: '', Folder: '',
           Backend: backends.includes('claude_code') ? 'claude_code' : (backends[0] || 'claude_code'),
           Account: '', Model: '', Effort: '', CloseTab: false, Repeat: 'interval', Every: 60, Unit: 'm', Time: '09:00', Days: [1, 2, 3, 4, 5],
           At: `${at.getFullYear()}-${pad(at.getMonth() + 1)}-${pad(at.getDate())}T${pad(at.getHours())}:${pad(at.getMinutes())}`,
           Cron: '*/30 * * * *', Telegram: false };
}

function schedDraftOf(j) {
  const base = schedNewDraft();
  const d = {};
  for (const k of Object.keys(base)) d[k] = Array.isArray(j[k]) ? [...j[k]] : (j[k] ?? base[k]);
  return d;
}

function updateSchedAntigravityModelOptions() {
  if (!CONF || !SCHED_EDIT || SCHED_EDIT.Backend !== 'antigravity_cli') return;
  const sel = $('sched-model'), custom = $('sched-model-custom');
  if (!sel || !custom) return;
  const k = cat('antigravity_cli');
  const value = SCHED_EDIT.Model || '';
  const models = k.models || [];
  sel.replaceChildren();
  const add = (id, name) => {
    const o = document.createElement('option');
    o.value = id; o.textContent = name; sel.appendChild(o);
  };
  add('', tr('(설정 기본값)'));
  models.forEach(id => add(id, k.modelLabels?.[id] || id));
  add('__custom_model__', tr('직접 입력…'));
  const manual = schedManualModel || (value !== '' && !models.includes(value));
  sel.value = manual ? '__custom_model__' : value;
  custom.hidden = !manual;
  custom.value = value;
}

function renderSchedules(formToo = true) {
  const g = document.getElementById('sched-grid');
  if (!g || !CONF) return;
  if (!g.querySelector('#sched-list')) {
    g.replaceChildren();
    const bar = document.createElement('div'); bar.className = 'sbar'; bar.id = 'sched-bar';
    const list = document.createElement('div'); list.id = 'sched-list';
    const form = document.createElement('div'); form.id = 'sched-form';
    const hist = document.createElement('div'); hist.id = 'sched-hist'; hist.className = 'shist';
    g.append(bar, list, form, hist);
    formToo = true;
  }
  renderSchedBar();
  renderSchedList();
  renderSchedHist();
  if (formToo) renderSchedForm();
}

function schedButton(text, title, fn, cls = 'btn') {
  const b = document.createElement('button');
  b.className = cls; b.textContent = text;
  if (title) b.title = title;
  b.addEventListener('click', fn);
  return b;
}

function renderSchedBar() {
  const bar = $('sched-bar');
  if (!bar) return;
  bar.replaceChildren();
  const add = schedButton(tr('＋ 예약 추가'), tr('새 예약 작업을 만듭니다'), () => {
    SCHED_EDIT = schedNewDraft();
    schedManualModel = false;
    renderSchedForm();
    $('sched-name')?.focus();
  }, 'btn act');
  add.id = 'sched-add';
  add.disabled = !!SCHED_EDIT;
  bar.append(add);
  const s = CONF.sched || {};
  if (s.note) {
    const n = document.createElement('span');
    n.className = 'sstat bad'; n.style.fontSize = '12px';
    n.textContent = tr(s.note);
    bar.append(n);
  }
}

function renderSchedList() {
  const list = $('sched-list');
  if (!list) return;
  list.replaceChildren();
  const jobs = CONF.sched?.jobs || [];
  if (!jobs.length) {
    const e = document.createElement('div');
    e.className = 'sempty';
    e.textContent = tr('예약 작업이 없습니다. [＋ 예약 추가] 로 만드세요.');
    list.append(e);
    return;
  }
  for (const j of jobs) {
    const row = document.createElement('div');
    row.className = 'sjob';
    row.dataset.schedId = j.Id;

    const name = document.createElement('div');
    name.className = 'sn';
    name.textContent = (j.Enabled ? '⏰ ' : '⏸ ') + j.Name;
    name.title = j.Prompt;

    const desc = document.createElement('div');
    desc.className = 'sd';
    desc.append(schedWhen(j) + '  ·  ' + schedWhere(j) + '\n');
    const stat = (text, cls, title) => {
      const e = document.createElement('span');
      e.className = 'sstat' + (cls ? ' ' + cls : '');
      e.textContent = text;
      if (title) e.title = title;
      desc.append(e);
    };
    if (j.running) stat(tr('실행 중…') + (j.pending ? tr(' · 끝나면 한 번 더 실행') : ''), 'run');
    else if (!j.Enabled) stat(tr('꺼짐'));
    else stat(j.next ? tr`다음 실행: ${schedFmt(j.next)}` : tr('다음 실행 없음'));
    if (j.last && j.last.status !== 'running') {
      desc.append('  ·  ');
      const when = schedFmt(j.last.finished || j.last.started);
      if (j.last.status === 'ok') stat(tr`최근 성공 · ${when}`, 'ok');
      else stat(tr`최근 실패 · ${when}`, 'bad', tr(j.last.error));
    }

    const ops = document.createElement('div');
    ops.className = 'so';
    ops.append(schedButton(tr('지금 실행'), tr('일정과 상관없이 바로 한 번 실행합니다'), () => wv?.postMessage({ t: 'sched.run', id: j.Id })));
    const edit = schedButton(tr('편집'), '', () => { SCHED_EDIT = schedDraftOf(j); schedManualModel = false; renderSchedForm(); $('sched-name')?.focus(); });
    edit.disabled = !!SCHED_EDIT;
    ops.append(edit);
    const on = document.createElement('select');
    [['true', tr('켜짐')], ['false', tr('꺼짐')]].forEach(([v, t]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = t; on.appendChild(o);
    });
    on.value = j.Enabled ? 'true' : 'false';
    on.addEventListener('change', () => wv?.postMessage({ t: 'sched.enable', id: j.Id, on: on.value === 'true' }));
    ops.append(on);
    const del = schedButton('×', tr('이 예약 작업을 지웁니다'), () => {
      // **한 번 묻는다.** 되돌릴 수 없는 것을 한 번의 실수로 날리게 두지 않는다.
      if (del.dataset.armed !== '1') {
        del.dataset.armed = '1'; del.textContent = tr('정말 지울까요? (다시 누르기)'); del.classList.add('on');
        setTimeout(() => { if (del.isConnected) { del.dataset.armed = ''; del.textContent = '×'; del.classList.remove('on'); } }, 4000);
        return;
      }
      wv?.postMessage({ t: 'sched.remove', id: j.Id });
    });
    ops.append(del);

    row.append(name, ops, desc);
    list.append(row);
  }
}

function renderSchedHist() {
  const box = $('sched-hist');
  if (!box) return;
  box.replaceChildren();
  const runs = CONF.sched?.history || [];
  const head = document.createElement('div');
  head.className = 'sh';
  head.append(tr('실행 기록'));
  if (runs.length) head.append(schedButton(tr('기록 지우기'), tr('끝난 실행 기록을 지웁니다'), () => wv?.postMessage({ t: 'sched.history.clear' })));
  box.append(head);
  if (!runs.length) {
    const e = document.createElement('div');
    e.className = 'sempty';
    e.textContent = tr('아직 실행 기록이 없습니다.');
    box.append(e);
    return;
  }
  for (const r of runs) {
    const row = document.createElement('div');
    row.className = 'shrow';
    const icon = r.status === 'ok' ? '✅' : r.status === 'running' ? '⏳' : '⚠';
    const body = (r.status === 'failed' ? tr(r.error) : r.answer) || '';
    const first = body.split('\n').find(l => l.trim()) || '';
    row.textContent = `${schedFmt(r.started)}  ${icon} ${r.jobName}` + (r.trigger === 'manual' ? tr(' · 수동') : '') +
                      (first ? '  —  ' + (first.length > 90 ? first.slice(0, 90) + '…' : first) : '');
    if (SCHED_OPEN.has(r.runId) && (body || r.tab)) {
      const pre = document.createElement('pre');
      pre.textContent = (r.tab ? tr`탭: ${r.tab}` + '\n\n' : '') + body;
      pre.addEventListener('click', e => e.stopPropagation());
      row.append(pre);
    }
    row.addEventListener('click', () => {
      if (SCHED_OPEN.has(r.runId)) SCHED_OPEN.delete(r.runId); else SCHED_OPEN.add(r.runId);
      renderSchedHist();
    });
    box.append(row);
  }
}

function schedPreview() {
  clearTimeout(schedPreviewTimer);
  if (!SCHED_EDIT) return;
  schedPreviewTimer = setTimeout(() => wv?.postMessage({ t: 'sched.preview', seq: ++schedPreviewSeq, job: SCHED_EDIT }), 250);
}

function renderSchedForm() {
  const box = $('sched-form');
  if (!box) return;
  box.replaceChildren();
  renderSchedBar();
  renderSchedList();
  const d = SCHED_EDIT;
  if (!d) return;

  const wrap = document.createElement('div');
  wrap.className = 'sform';
  const title = document.createElement('div');
  title.className = 'sft';
  title.textContent = d.Id ? tr('예약 편집') : tr('새 예약');
  const g = document.createElement('div');
  g.className = 'grid';
  wrap.append(title, g);
  box.append(wrap);

  const label = text => { const l = document.createElement('label'); l.textContent = text; return l; };
  const row = (text, ...els) => {
    const holder = els.length === 1 ? els[0] : (() => { const r = document.createElement('div'); r.className = 'row2'; r.append(...els); return r; })();
    g.append(label(text), holder);
    return holder;
  };
  const input = (key, opt = {}) => {
    const e = document.createElement('input');
    e.type = opt.type || 'text';
    e.value = d[key] ?? '';
    if (opt.placeholder) e.placeholder = opt.placeholder;
    if (opt.id) e.id = opt.id;
    if (opt.min !== undefined) e.min = opt.min;
    e.addEventListener('input', () => { d[key] = opt.type === 'number' ? parseInt(e.value, 10) || 0 : e.value; if (opt.preview) schedPreview(); });
    return e;
  };
  const select = (key, choices, opt = {}) => {
    const e = document.createElement('select');
    for (const [v, t] of choices) { const o = document.createElement('option'); o.value = v; o.textContent = t; e.appendChild(o); }
    e.value = String(d[key]);
    if (opt.id) e.id = opt.id;
    e.addEventListener('change', () => {
      d[key] = opt.bool ? e.value === 'true' : e.value;
      if (opt.rerender) renderSchedForm();
      if (opt.preview) schedPreview();
    });
    return e;
  };

  row(tr('이름'), input('Name', { id: 'sched-name', placeholder: tr('비우면 프롬프트 첫 줄') }));
  const prompt = document.createElement('textarea');
  prompt.id = 'sched-prompt';
  prompt.value = d.Prompt || '';
  prompt.placeholder = tr('정해 둔 시각에 CLI 로 보낼 내용');
  prompt.addEventListener('input', () => { d.Prompt = prompt.value; });
  row(tr('프롬프트'), prompt);

  row(tr('보낼 곳'), select('Target', [['new', tr('새 탭 열기')], ['tab', tr('열려 있는 탭')]], { id: 'sched-target', rerender: true }));
  if (d.Target === 'tab') {
    const tabInput = input('TabName', { id: 'sched-tab', placeholder: tr('탭띠에 보이는 이름 그대로') });
    const dl = document.createElement('datalist');
    dl.id = 'sched-tabs';
    for (const t of TABS.values()) {
      if (t.kind !== 'cli' || t.login) continue;
      const o = document.createElement('option');
      o.value = t.alias || t.name;
      dl.appendChild(o);
    }
    tabInput.setAttribute('list', dl.id);
    wrap.append(dl);
    row(tr('탭 이름'), tabInput);
  } else {
    const folder = input('Folder', { id: 'sched-folder', placeholder: tr('CLI 가 실행될 작업 폴더') });
    folder.style.flex = '1';
    row(tr('폴더'), folder, schedButton(tr('찾아보기'), '', () => wv?.postMessage({ t: 'sched.pick', path: d.Folder || '' })));
    const backends = Object.keys(CONF.catalog || {});
    if (!backends.includes(d.Backend)) backends.unshift(d.Backend);
    const backendSel = select('Backend', backends.map(b => [b, CONF.catalog?.[b]?.display || cliName(b)]), { id: 'sched-backend' });
    backendSel.addEventListener('change', () => {
      d.Model = ''; d.Effort = ''; schedManualModel = false;
      renderSchedForm();
    });
    row('CLI', backendSel);
    const accs = (CONF.accounts || []).filter(a => a.backend === d.Backend);
    const accChoices = accs.length ? accs.map(a => [a.id, schedAccountLabel(a)]) : [['', tr('기본')]];
    if (!accChoices.some(([v]) => v === d.Account)) d.Account = accChoices[0][0];
    row(tr('사용할 계정'), select('Account', accChoices, { id: 'sched-account' }));

    const k = cat(d.Backend);
    if (d.Backend === 'antigravity_cli') {
      const mWrap = document.createElement('div');
      const mSel = document.createElement('select');
      mSel.id = 'sched-model'; mSel.style.width = '100%';
      mSel.setAttribute('aria-label', tr('Antigravity 모델'));
      const mCustom = document.createElement('input');
      mCustom.id = 'sched-model-custom'; mCustom.style.width = '100%'; mCustom.style.marginTop = '6px';
      mCustom.setAttribute('aria-label', tr('Antigravity 모델 직접 입력'));
      mCustom.placeholder = tr('모델 ID 또는 이름');
      mSel.addEventListener('change', () => {
        schedManualModel = mSel.value === '__custom_model__';
        mCustom.hidden = !schedManualModel;
        if (schedManualModel) { mCustom.value = d.Model || ''; mCustom.focus(); }
        else { d.Model = mSel.value; mCustom.value = mSel.value; }
      });
      mCustom.addEventListener('input', () => { d.Model = mCustom.value; });
      mWrap.append(mSel, mCustom);
      row(tr('모델'), mWrap);
      updateSchedAntigravityModelOptions();
    } else if (k.modelsComplete) {
      const models = k.models || [];
      if (d.Model && !models.includes(d.Model)) d.Model = '';
      row(tr('모델'), select('Model', [['', tr('(설정 기본값)')], ...models.map(m => [m, m])], { id: 'sched-model', rerender: true }));
    } else {
      const mIn = input('Model', { id: 'sched-model', placeholder: tr('비우면 설정 기본값') });
      if ((k.models || []).length) {
        const dl = document.createElement('datalist');
        dl.id = 'sched-models';
        for (const m of k.models) { const o = document.createElement('option'); o.value = m; dl.appendChild(o); }
        wrap.append(dl);
        mIn.setAttribute('list', dl.id);
      }
      row(tr('모델'), mIn);
    }
    const effs = effortChoices(d.Backend, d.Model || CONF.settings?.[k.modelKey] || '');
    if (d.Effort && !effs.includes(d.Effort)) d.Effort = '';
    row(tr('추론 강도'), select('Effort', effs.map(e => [e, e === '' ? tr('(설정 기본값)') : e]), { id: 'sched-effort' }));

    row(tr('실행 후 탭'), select('CloseTab', [['false', tr('탭 유지')], ['true', tr('끝나면 탭 닫기')]], { id: 'sched-close', bool: true }));
  }

  row(tr('반복'), select('Repeat', [['interval', tr('일정 간격')], ['daily', tr('매일')], ['weekly', tr('요일 지정')],
                                     ['once', tr('한 번')], ['cron', tr('cron 식')]], { id: 'sched-repeat', rerender: true, preview: true }));
  if (d.Repeat === 'interval') {
    const every = input('Every', { id: 'sched-every', type: 'number', min: 1, preview: true });
    every.style.width = '110px';
    const unit = select('Unit', [['m', tr('분마다')], ['h', tr('시간마다')]], { id: 'sched-unit', preview: true });
    unit.style.width = '140px';
    row(tr('간격'), every, unit);
  }
  if (d.Repeat === 'daily' || d.Repeat === 'weekly') {
    const time = input('Time', { id: 'sched-time', type: 'time', preview: true });
    time.style.width = '140px';
    row(tr('시각'), time);
  }
  if (d.Repeat === 'weekly') {
    const days = document.createElement('div');
    days.className = 'sdays';
    days.id = 'sched-days';
    SCHED_DAYS.forEach((name, i) => {
      const l = document.createElement('label');
      const c = document.createElement('input');
      c.type = 'checkbox';
      c.checked = (d.Days || []).includes(i);
      c.dataset.day = String(i);
      c.addEventListener('change', () => {
        const set = new Set(d.Days || []);
        if (c.checked) set.add(i); else set.delete(i);
        d.Days = [...set].sort((a, b) => a - b);
        schedPreview();
      });
      l.append(c, tr(name));
      days.append(l);
    });
    row(tr('요일'), days);
  }
  if (d.Repeat === 'once') {
    const at = input('At', { id: 'sched-at', type: 'datetime-local', preview: true });
    at.style.width = '220px';
    row(tr('날짜·시각'), at);
  }
  if (d.Repeat === 'cron') {
    row(tr('cron 식'), input('Cron', { id: 'sched-cron', placeholder: '*/5 9-18 * * 1-5', preview: true }));
    const hint = document.createElement('div');
    hint.className = 'note'; hint.style.marginTop = '0';
    hint.textContent = tr('분 시 일 월 요일 — 예: */10 * * * * (10분마다), 0 9 * * 1-5 (평일 9시), 30 18 * * FRI (금요일 18:30)');
    g.append(label(''), hint);
  }

  const tg = select('Telegram', [['false', tr('안 보냄')], ['true', tr('보냄')]], { id: 'sched-telegram', bool: true });
  tg.style.width = '140px';
  const tgNote = document.createElement('span');
  tgNote.className = 'note'; tgNote.style.margin = '0'; tgNote.style.alignSelf = 'center';
  tgNote.textContent = CONF.sched?.telegram ? tr('페어링한 텔레그램 대화로 결과를 보냅니다.') : tr('텔레그램 원격을 연결하고 페어링해야 받습니다.');
  row(tr('텔레그램 알림'), tg, tgNote);

  const preview = document.createElement('span');
  preview.id = 'sched-preview';
  preview.style.fontSize = '12px'; preview.style.color = '#cde';
  row(tr('다음 실행'), preview);

  const err = document.createElement('span');
  err.id = 'sched-err';
  err.className = 'sstat bad'; err.style.fontSize = '12px';
  const save = schedButton(tr('저장'), tr('예약 작업을 저장하고 바로 일정에 올립니다'), () => {
    err.textContent = '';
    wv?.postMessage({ t: 'sched.save', job: SCHED_EDIT });
  }, 'btn act');
  save.id = 'sched-save';
  const cancel = schedButton(tr('취소'), '', () => { SCHED_EDIT = null; renderSchedForm(); });
  cancel.id = 'sched-cancel';
  const buttons = document.createElement('div');
  buttons.className = 'row2'; buttons.style.cssText = 'align-items:center;margin-top:10px';
  buttons.append(save, cancel, err);
  wrap.append(buttons);
  schedPreview();
}

function applyLanguage(value) {
  if (CONF) CONF.settings.UiLanguage = value === 'en' ? 'en' : 'ko';
  if (!UiLanguage.set(value)) return;
  renderTabs(); renderSites(); renderUsage(); renderAtts();
  if (confOn) {
    const scroll = $('conf').scrollTop;
    const manual = $('ag-model')?.dataset.manual;
    // Transient account/token drafts stay in memory and are never saved by a language change.
    const drafts = new Map([...$('conf').querySelectorAll('[data-conf-draft]')].map(e => [e.dataset.confDraft, e.value]));
    const panels = [...$('conf').querySelectorAll('[data-token-panel]')].map(e => e.dataset.tokenPanel);
    renderConf();
    for (const button of $('conf').querySelectorAll('[data-token-account]')) if (panels.includes(button.dataset.tokenAccount)) button.click();
    for (const input of $('conf').querySelectorAll('[data-conf-draft]')) if (drafts.has(input.dataset.confDraft)) input.value = drafts.get(input.dataset.confDraft);
    if ($('ag-model') && manual) { $('ag-model').dataset.manual = manual; updateAntigravityModelOptions(); }
    $('conf').scrollTop = scroll;
  }
  if (pickIsOn()) renderPick();
  if (swapIsOn()) renderSwap();
  if ($('hist').classList.contains('on')) renderHist();
  for (const t of TABS.values()) if (t.kind === 'browser') {
    t.back.title = tr('뒤로'); t.fwd.title = tr('앞으로'); t.reload.title = tr('새로고침');
    t.urlBox.placeholder = tr('주소를 넣고 Enter');
  }
  for (const line of $('log').children) line.textContent = line.dataset.time + '  ' + tr(line.dataset.message);
  layoutBrowsers();
}

// ── 호스트 메시지 ────────────────────────────────────
wv?.addEventListener('message', ev => {
  const m = ev.data;
  if (!m || typeof m !== 'object') return;
  if (typeof m.t === 'string' && m.t.startsWith('pet.')) { PetUI.handle(m); return; }

  // 터미널 메시지는 **자기 탭에만** 그린다. 번호가 없거나 이미 닫힌 탭이면 버린다 —
  // 아무 데나 그리면 옆 대화에 남의 출력이 섞인다.
  if (typeof m.t === 'string' && m.t.startsWith('term.')) {
    const t = tab(m.id);
    if (!t) return;
    PetUI.terminal(m);
    switch (m.t) {
      case 'term.out':
        if (m.data) t.lastOutputAt = performance.now();
        t.term?.write(m.data || '');
        break;

      // 준비가 배경에서 도는 동안 **먼저 오는 신호.** 이게 없으면 CLI 탐색·프로세스 기동이
      // 끝날 때까지 화면이 비어 있어, 사용자는 멈춘 줄 안다.
      case 'term.starting':
        t.live = false; t.dead = false; renderTabs();
        if (!m.again) t.term?.write(tr`\r\n\x1b[90m── ${m.cli || t.cli} 를 켜는 중입니다. 잠시만 기다리세요 ──\x1b[0m\r\n`);
        break;

      case 'term.ready':
        t.live = true; t.dead = false; renderTabs();
        t.lastOutputAt = performance.now();
        // 붙자마자 현재 크기를 한 번 더 알린다 — 첫 start 는 xterm 이 자리를 잡기 전
        // 크기로 나갈 수 있고, 그러면 첫 화면이 어긋난 채 그려진다.
        setTimeout(() => { fitNow(t); if (t.id === active) t.term?.focus(); }, 50);
        break;

      case 'term.exit':
        t.live = false; t.dead = true; renderTabs();
        t.term?.write(tr`\r\n\x1b[90m── 터미널이 끝났습니다 (코드 ${m.code}) ──\x1b[0m\r\n`);
        break;

      case 'term.error':
        t.live = false; t.dead = true; renderTabs();
        t.term?.write(`\r\n\x1b[31m${(m.msg || '').replace(/\n/g, '\r\n')}\x1b[0m\r\n`);
        break;
    }
    return;
  }

  switch (m.t) {
    case 'tab.opened': addTab(m); break;

    // 이것만 다른 데 안 적히던 말이라 기록으로 옮긴다 — 폴더 창을 닫았는데
    // 아무 일도 안 일어나면 잘못 눌렀는지 고장인지 구별할 수 없다.
    case 'tab.cancel':
      log(tr('폴더 고르기를 취소했습니다 — 열려 있던 대화는 그대로입니다.'), 'i');
      break;

    // [＋ 새 대화] 의 답 — 고를 CLI 목록. 누른 것에 대한 답이므로 받자마자 연다.
    // 이미 떠 있으면(두 번 누름) 목록만 갈고 초점을 다시 잡는다 — 다시 그리면 초점이 사라진다.
    case 'newchat':
      PICK = { last: m.last || '', lastAccount: m.lastAccount || '', items: m.items || [] };
      renderPick();
      if (pickIsOn()) pickFocus();
      else pickOpen(true);
      break;

    case 'history.loading':
      HIST = [];
      $('hlist').replaceChildren();
      $('hnote').textContent = tr('지난 대화를 읽는 중…');
      break;

    case 'history':
      HIST = m.items || [];
      renderHist();
      break;

    case 'conf':
      CONF = { settings: m.settings, catalog: m.catalog, detect: m.detect, file: m.file,
               accounts: m.accounts || [], version: m.version || '', modelsPath: m.settings?.AntigravityCliPath || '',
               telegram: m.telegram || null, sched: m.sched || CONF?.sched || null };
      PetUI.apply(m.settings?.Pet);
      applyLanguage(m.settings?.UiLanguage || 'ko');
      renderSites();
      renderUsage();          // 탐지 결과·계정 목록이 바뀌면 사용량 줄에 설 계정도 바뀐다
      if (confOn) renderConf();
      break;

    case 'ui.language':
      applyLanguage(m.language);
      break;

    case 'conf.startup.state':
      if (CONF?.settings) CONF.settings.RunAtStartup = !!m.on;
      if ($('run-at-startup')) $('run-at-startup').value = m.on ? 'true' : 'false';
      break;

    case 'conf.models.loading':
      if (!CONF) break;
      if (CONF.modelsPath !== m.path && CONF.catalog.antigravity_cli) {
        CONF.catalog.antigravity_cli.models = [];
        CONF.catalog.antigravity_cli.modelLabels = {};
      }
      CONF.modelsPath = m.path;
      CONF.modelsRequest = m.request; CONF.modelsLoading = true; CONF.modelsError = '';
      updateAntigravityModelOptions();
      updateSchedAntigravityModelOptions();
      break;

    case 'conf.models':
      if (!CONF || m.request !== CONF.modelsRequest) break;
      CONF.modelsLoading = false; CONF.modelsError = m.error || '';
      if (!m.error && CONF.catalog.antigravity_cli) {
        CONF.catalog.antigravity_cli.models = m.models || [];
        CONF.catalog.antigravity_cli.modelLabels = m.modelLabels || {};
      }
      updateAntigravityModelOptions();
      updateSchedAntigravityModelOptions();
      break;

    // [다른 계정으로 이어가기] 의 답 — 넘길 곳 목록. 누른 것에 대한 답이므로 받자마자 연다.
    case 'switch':
      if (!m.history && !tab(m.id)) break;
      if (m.history && !$('hist').classList.contains('on')) break;
      SWAP = { id: m.id, history: !!m.history, from: m.from || {}, items: m.items || [], session: m.session || null, loading: !!m.loading };
      renderSwap();
      if (swapIsOn()) swapFocus(); else swapOpen(true);
      break;

    // 넘길 대화(첫 발화 · 말 수). 목록보다 늦게 온다 — 큰 기록은 읽는 데 시간이 걸린다.
    case 'switch.session':
      if (SWAP?.id === m.id) { SWAP.session = m.session || null; SWAP.loading = false; renderSwap(); }
      break;

    case 'history.switched':
      if (SWAP?.id === m.id) { swapOpen(false); histOpen(false); SWAP = null; }
      break;

    case 'history.switch.failed':
      if (SWAP?.id === m.id) {
        SWAP.busy = false;
        renderSwap();
        $('ssess').className = 'ssess bad';
        $('ssess').textContent = tr(m.error);
      }
      break;

    // 넘기는 중 · 실패. 터미널에 한 줄 남긴다 — 기록 줄은 접혀 있어 안 보일 수 있다.
    case 'switch.busy': {
      const t = tab(m.id);
      t?.term?.write(tr`\r\n\x1b[90m── ${m.to} 로 넘기는 중입니다… ──\x1b[0m\r\n`);
      break;
    }
    case 'switch.failed': {
      const t = tab(m.id);
      t?.term?.write(tr('\r\n\x1b[33m── 넘기지 못했습니다 — 아래 [기록] 을 보세요. 이 탭은 그대로입니다. ──\x1b[0m\r\n'));
      break;
    }

    // 넘겼다 — **같은 탭**을 새 CLI·계정으로 다시 띄운다. 이름·자리는 그대로 두고 터미널만 새로 그린다.
    case 'tab.switched': {
      const t = tab(m.id);
      if (!t) break;
      Object.assign(t, { backend: m.backend, cli: m.cli, memoryFile: m.memoryFile,
                         account: m.account || '', accountName: m.accountName || '' });
      t.live = false; t.dead = false;
      t.lastOutputAt = performance.now(); t.lastWakeAt = 0;
      try { t.term?.reset(); } catch {}
      t.term?.write(tr`\x1b[90m── ${m.cli}${m.accountName ? tr` · '${m.accountName}' 계정` : tr(' · 기본 계정')} 으로 이어갑니다 ──\x1b[0m\r\n`);
      renderTabs();
      fitNow(t);
      wv?.postMessage({ t: 'term.start', id: t.id, cols: t.term?.cols || 80, rows: t.term?.rows || 24,
                        fresh: !!m.fresh, sessionId: m.sessionId || '' });
      break;
    }

    // 계정 이름을 바꿨다 — 그 계정을 쓰는 탭 배지도 바꾼다.
    case 'tab.account': {
      const t = tab(m.id);
      if (t) { t.accountName = m.accountName || ''; renderTabs(); }
      break;
    }

    // 주소·제목·뒤로/앞으로. **매번 전부 온다** — 일부만 받아 화면이 나머지를 캐시하면
    // 어느 쪽이 최신인지 갈리고, 그 차이는 "뒤로 버튼이 안 살아난다" 로만 보인다.
    case 'browser.state': {
      const t = tab(m.id);
      if (!t || t.kind !== 'browser') break;
      t.url = m.url || '';
      // 치는 중에 덮어쓰지 않는다 — 주소를 반쯤 고쳤는데 페이지가 넘어가면 글자가 사라진다.
      if (t.urlBox && document.activeElement !== t.urlBox) t.urlBox.value = t.url;
      if (t.back) t.back.disabled = !m.canBack;
      if (t.fwd) t.fwd.disabled = !m.canForward;
      if (m.title && m.title !== t.name) { t.name = m.title; renderTabs(); }
      break;
    }

    // 페이지가 스스로 닫으려 한다(window.close). 탭 닫기와 같은 길로 보낸다.
    case 'tab.closed': closeTab(m.id); break;

    // 호스트가 그 탭을 띄워 달라고 한다(캡처 전에 온다 — 화면에 없는 탭은 못 찍는다).
    case 'tab.show': if (tab(m.id)) showTab(m.id); break;

    // 호스트가 고른 파일들. 경로만 들고 있다가 전송 때 넘긴다.
    case 'attach.picked':
      (m.files || []).forEach(f => atts.push({ kind: 'file', path: f.path, name: f.name, size: f.size }));
      renderAtts();
      break;

    // 잘라 낸 화면. 붙여넣은 이미지와 **같은 종류로 넣는다** — 미리보기·전송·저장이
    // 전부 그 길을 이미 타고 있어 여기서 새로 만들 것이 없다.
    case 'attach.captured':
      atts.push({ kind: 'paste', capture: true, dataUrl: m.dataUrl, size: m.size,
                  name: tr('캡처 ') + (atts.filter(a => a.capture).length + 1) });
      renderAtts();
      break;

    // 호스트가 이름을 받아들였다. 화면은 이미 바꿔 뒀지만, 호스트가 다듬은 값
    // (앞뒤 공백·길이 자르기)으로 맞춰 둔다 — 다음에 켤 때와 화면이 달라지면 안 된다.
    case 'tab.renamed': {
      const t = tab(m.id);
      if (t) { t.alias = m.alias || ''; renderTabs(); }
      break;
    }

    // 오른쪽 버튼 [붙여넣기] 의 답. 어디에 넣을 것이었는지는 호스트가 그대로 돌려준다.
    case 'clip.text':
      if (m.to === 'term') {
        const t = tab(m.id);
        // xterm 자신의 붙여넣기를 쓴다 — 대괄호 붙여넣기로 감싸 줘야 여러 줄이
        // 한 줄씩 제출되지 않는다.
        if (t?.term?.paste) t.term.paste(m.text);
        else if (t) wv?.postMessage({ t: 'term.in', id: t.id, data: m.text });
      } else {
        insertAt(pasteEl, m.text);
      }
      pasteEl = null;
      break;

    // 글자가 없고 그림만 있는 클립보드. 터미널도 입력창도 그림은 못 받으므로 첨부로 보낸다.
    case 'clip.image':
      atts.push({ kind: 'paste', dataUrl: m.dataUrl, size: m.size,
                  name: tr('붙여넣은 이미지 ') + (atts.filter(a => a.kind === 'paste').length + 1) });
      renderAtts();
      pasteEl = null;
      break;

    case 'cli.picked':
      if (CONF) {
        const key = cat(m.which).pathKey || ({ claude_code: 'ClaudeCliPath', codex_cli: 'CodexCliPath', antigravity_cli: 'AntigravityCliPath' })[m.which];
        if (key) CONF.settings[key] = m.path;
        renderConf();
      }
      break;

    // 못 읽었으면 빈 목록이 온다 — 지난 값을 남겨 두면 로그아웃·망 끊김 뒤에도
    // 옛 숫자를 사실인 양 계속 보여 준다.
    case 'usage':
      USAGE[ukey(m.backend, m.account)] = m.windows || [];
      renderUsage();
      if (swapIsOn()) renderSwap();     // 고르는 중에 잔량이 오면 바로 비춘다
      break;

    case 'tg.state':
      if (CONF) { CONF.telegram = m.state; renderTelegram(); }
      break;

    case 'sched.state':
      if (CONF) { CONF.sched = m.state; renderSchedules(false); }
      break;

    case 'sched.saved':
      if (m.ok) { SCHED_EDIT = null; renderSchedForm(); }
      else if ($('sched-err')) $('sched-err').textContent = tr(m.error || '');
      break;

    case 'sched.preview':
      if (m.seq === schedPreviewSeq && $('sched-preview')) {
        const p = $('sched-preview');
        p.style.color = m.error ? '#e88' : '#cde';
        p.textContent = m.error ? tr(m.error) : ((m.times || []).map(schedFmt).join('  ·  ') || tr('없음'));
      }
      break;

    case 'sched.picked':
      if (SCHED_EDIT) { SCHED_EDIT.Folder = m.path || ''; renderSchedForm(); }
      break;

    case 'log': log(m.msg, m.level); break;
  }
});

// ── 시작 ─────────────────────────────────────────────
syncEmpty();
renderUsage();            // 첫 숫자가 오기 전에도 줄은 선다("읽는 중…") — 빈 자리는 고장과 구별이 안 된다
wv?.postMessage({ t: 'ui.ready' });
</script>
</body>
</html>
